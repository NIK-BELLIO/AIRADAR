<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#08090c" />
<meta name="robots" content="noindex, follow" />
<title>Page not found - AI Radar</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Vazirmatn:wght@400;600;800&display=swap" />
<style>
:root { --bg:#08090c; --card:#111318; --line:rgba(255,255,255,.09); --text:#e6e8ec; --muted:#9aa1ad; --accent:#12d6f5; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; background:var(--bg); color:var(--text);
  font:500 16px/1.7 Manrope,Vazirmatn,system-ui,sans-serif;
  display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 20px; }
a { color:var(--accent); }
.wrap { width:100%; max-width:560px; }
.top { display:flex; align-items:center; gap:10px; color:var(--text);
  text-decoration:none; font-weight:800; margin-bottom:48px; }
.top img { width:28px; height:28px; }
.code { font:800 96px/1 "Space Grotesk",Manrope,system-ui,sans-serif;
  letter-spacing:-.05em; color:var(--accent); margin:0 0 8px; }
h1 { font-size:26px; line-height:1.25; margin:0 0 12px; }
p { color:#c9cdd5; margin:0 0 10px; }
.fa { direction:rtl; font-family:Vazirmatn,system-ui,sans-serif; color:var(--muted); }
.links { display:flex; flex-wrap:wrap; gap:10px; margin-top:28px; }
.links a { display:inline-flex; align-items:center; gap:6px; padding:10px 16px;
  border:1px solid var(--line); border-radius:10px; background:var(--card);
  color:var(--text); text-decoration:none; font-weight:600; font-size:14px; }
.links a:hover { border-color:rgba(255,255,255,.28); }
.links a.primary { background:var(--accent); border-color:var(--accent); color:#08090c; }
</style>
</head>
<body>
<main class="wrap">
  <a class="top" href="/"><img src="/logo-mark.svg" alt="" />AI Radar</a>
  <p class="code" aria-hidden="true">404</p>
  <h1>This page went off radar.</h1>
  <p>The link is broken or the page has moved. The tools below still work.</p>
  <p class="fa" lang="fa" dir="rtl">این صفحه پیدا نشد. لینک خراب است یا صفحه جابه‌جا شده. ابزارهای زیر در دسترس‌اند.</p>
  <nav class="links" aria-label="Popular pages">
    <a class="primary" href="/studio/">Video Studio</a>
    <a href="/prompt-lab/">Prompt Lab</a>
    <a href="/spark/">Spark</a>
    <a href="/radar/">Radar</a>
    <a href="/">Home</a>
  </nav>
</main>
</body>
</html>
